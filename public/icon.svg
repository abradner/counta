<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">counta.click</title>
  <!--
    counta.click icon: the dose counter window of a FlexTouch pen, with the
    mirrored indicator that brackets it on a real Wegovy pen, framing a C for
    counta. Portrait, because the pen is a vertical object and that silhouette
    is what makes the mark read as a pen rather than a generic counter.

    Rules that keep it working at both ends of the size range:
      - The C is DRAWN as an arc, not set as text. A font renders differently
        on every platform, and this file goes to browsers as-is.
      - A C beats a numeral at 16px: one open stroke stays open, where an 8's
        two counters fill in and blob.
      - Nothing thinner than 4 units.
      - Exactly three elements: window, letter, indicator pair. Judged at 16px
        AND at iOS home-screen size — small punishes detail, large punishes
        sparseness, and only checking one of them gets you the other's failure.
      - Navy tile: a near-white one has no silhouette on a light tab strip.

    On the Commodore question, since it will come up again: their mark is a C
    standing alone with the chevron nested inside its own negative space. The
    distance here comes from the C being contained in a window, and the
    indicators being symmetric, plain triangles, outside that window. Keep all
    three of those and this stays distinct; drop them and it won't.

    Keep double hyphens out of this comment; they make the file invalid XML.
  -->
  <rect width="64" height="64" rx="14" fill="#1b3a6b"/>
  <rect x="19" y="9" width="26" height="46" rx="8" fill="#f4f6f9"/>
  <path d="M 38.5 24.5 A 9.5 9.5 0 1 0 38.5 39.5" stroke="#1b3a6b" stroke-width="4.5"
        fill="none" stroke-linecap="round"/>
  <path d="M 9 25 L 9 39 L 16 32 Z" fill="#e65300"/>
  <path d="M 55 25 L 55 39 L 48 32 Z" fill="#e65300"/>
</svg>
