<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">counta.click</title>
  <!--
    counta.click favicon.

    The mark is a C that doubles as a pen's dose dial: the ring is the dial,
    the gap is the counter window, and the orange dot is the indicator sitting
    in it. One shape carrying both the brand letter and the pen reference is
    what lets it survive being shrunk.

    Authored on a 64px grid and judged at 16px, which is the size that
    actually matters. Constraints that keep it legible there:
      no stroke thinner than 10 units; exactly two elements plus the tile;
      the gap is wide enough that the dot never touches the ring; no
      gradients, no text (a font would render differently everywhere).

    The navy tile is deliberate: it holds a silhouette on both light and dark
    tab strips. A near-white tile disappears on a light one.

    Keep double hyphens out of this comment; they make the file invalid XML.
  -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#1b3a6b"/>
  <path d="M 41.5 18 A 19 19 0 1 0 41.5 46" stroke="#f4f6f9" stroke-width="12"
        fill="none" stroke-linecap="round"/>
  <circle cx="49" cy="32" r="5.5" fill="#e65300"/>
</svg>
