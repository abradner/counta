<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">counta.click</title>
  <!--
    counta.click icon: the dose counter window of a FlexTouch pen, with the
    mirrored indicator that brackets it on a real Wegovy pen. Portrait, because
    the pen is a vertical object and that silhouette is what makes the mark
    recognisable rather than generic.

    Rules that keep it working at both ends of the size range:
      - The numeral is DRAWN, not text. A font renders differently on every
        platform, and this file is served as-is to browsers.
      - Nothing thinner than 4 units, so the 16px favicon holds up.
      - Exactly three elements: window, numeral, indicator pair. Judged at
        16px and at iOS home-screen size; anything more turns to mud small.
      - Navy tile, because a near-white one has no silhouette on a light
        browser tab strip.

    Avoid: a bold C with a coloured element in its mouth. However the palette
    is changed, that is structurally the Commodore mark.

    Keep double hyphens out of this comment; they make the file invalid XML.
  -->
  <rect width="64" height="64" rx="14" fill="#1b3a6b"/>
  <rect x="19" y="9" width="26" height="46" rx="8" fill="#f4f6f9"/>
  <g fill="none" stroke="#1b3a6b" stroke-width="4.5">
    <circle cx="32" cy="25" r="5"/>
    <circle cx="32" cy="38" r="6.5"/>
  </g>
  <path d="M 9 25 L 9 39 L 16 32 Z" fill="#e65300"/>
  <path d="M 55 25 L 55 39 L 48 32 Z" fill="#e65300"/>
</svg>
