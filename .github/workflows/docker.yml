name: docker

on:
  # Automatic only on main (and release tags) — not on every branch/PR push.
  # Run it manually on a branch via workflow_dispatch when you actually want
  # an image out of it (e.g. to test-deploy a branch).
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize per ref so an older main build can't finish after a newer one
# and repoint `latest` backwards. This only protects against overlapping
# runs — see the tip-check step below for the rerun-after-completion case,
# which concurrency can't catch.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push image (ghcr.io)
    # The cluster runs on arm64 (Pi 5 nodes) — build that natively on GitHub's
    # arm runners. amd64 is the secondary target, built under QEMU for x86
    # hosts (local dev, legacy VMs).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false is load-bearing, not just for the raw-tag rule below:
          # metadata-action's default flavor still auto-adds `latest` off
          # type=ref,event=tag for a v* push, which would repoint `latest` on
          # an old release tag (or a rerun of one) before the guarded step
          # ever runs. Keep this even though there's no explicit raw `latest`
          # rule here — `latest` is only ever set by the guarded step below.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish latest (only if still the tip of main)
        # Guards the case concurrency can't: a rerun of an old completed
        # workflow run (push OR a manual workflow_dispatch against main)
        # still targets refs/heads/main and would otherwise republish
        # `latest` pointing at a stale commit. Only alias `latest` onto this
        # build's digest if HEAD is still what main actually points at right
        # now. Never fires for tag pushes or branch dispatches — `latest`
        # only ever tracks main.
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "::error::git ls-remote returned no SHA for refs/heads/main — refusing to guess, skipping latest."
            exit 1
          fi
          if [ "$remote_sha" = "${{ github.sha }}" ]; then
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:latest \
              ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          else
            echo "main has moved to $remote_sha since this run started (${{ github.sha }}) — skipping latest."
          fi
