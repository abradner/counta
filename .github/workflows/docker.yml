name: docker

on:
  # Pushes: only main and release tags publish. Not every branch push — run
  # workflow_dispatch on a branch when you actually want an image out of it
  # (e.g. to test-deploy one).
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # PRs build but never push (see `push:` on the build step). Without this a
  # change to the Dockerfile, .dockerignore or bin/docker-entrypoint gets a
  # green PR from ci.yml having never been built, and first breaks on the
  # post-merge main run — which is also the run that moves `:latest`. That is
  # the "a skipped job is not a passing job" caution in AGENTS.md §7, so the
  # workflow closes it rather than the doc just warning about it.
  pull_request:

permissions:
  contents: read
  packages: write

# Serialize per ref so an older main build can't finish after a newer one
# and repoint `latest` backwards. This only protects against overlapping
# runs — see the tip-check step below for the rerun-after-completion case,
# which concurrency can't catch.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build image (pushes to ghcr.io on main/tags only)
    # The cluster runs on arm64 (Pi 5 nodes) — build that natively on GitHub's
    # arm runners. arm64 only: the amd64 target used to be built here under
    # QEMU on main/tag pushes and dominated wall clock (in mcg, the same
    # shape, it was ~14 of ~16 minutes — see mcg#9). x86 hosts can
    # `docker build` locally; if publishing amd64 ever matters again, add a
    # parallel native ubuntu-24.04 job and merge digests with imagetools
    # rather than reintroducing QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Nothing to log in for on a PR — it never pushes, and a fork PR's
      # GITHUB_TOKEN has no packages:write anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false is load-bearing, not just for the raw-tag rule below:
          # metadata-action's default flavor still auto-adds `latest` off
          # type=ref,event=tag for a v* push, which would repoint `latest` on
          # an old release tag (or a rerun of one) before the guarded step
          # ever runs. Keep this even though there's no explicit raw `latest`
          # rule here — `latest` is only ever set by the guarded step below.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache, not type=gha: GitHub's Actions cache evicts
          # entries unused for 7 days, so infrequent builds always started
          # cold. A buildcache tag on ghcr.io persists until we delete it,
          # so the bundle-install layer survives between releases. PRs only
          # read the cache — a fork PR's GITHUB_TOKEN has no packages:write,
          # and cache writes belong to trusted refs anyway.
          #
          # Concurrent non-PR runs (e.g. a main push racing a tag push —
          # concurrency: groups by ref, so it doesn't serialize these) can
          # both export to this one tag; last write wins. Accepted: the
          # cache is best-effort, the loser costs one partially-cold build,
          # never a wrong image. Per-ref tags would fix it at the price of
          # main and tag builds never sharing a cache — worse in practice,
          # since tags are cut from main.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', github.repository) || '' }}

      - name: Publish latest (only if still the tip of main)
        # Guards the case concurrency can't: a rerun of an old completed
        # workflow run (push OR a manual workflow_dispatch against main)
        # still targets refs/heads/main and would otherwise republish
        # `latest` pointing at a stale commit. Only alias `latest` onto this
        # build's digest if HEAD is still what main actually points at right
        # now. Never fires for tag pushes or branch dispatches — `latest`
        # only ever tracks main.
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "::error::git ls-remote returned no SHA for refs/heads/main — refusing to guess, skipping latest."
            exit 1
          fi
          if [ "$remote_sha" = "${{ github.sha }}" ]; then
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository }}:latest \
              ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          else
            echo "main has moved to $remote_sha since this run started (${{ github.sha }}) — skipping latest."
          fi
