name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Supersede in-flight runs on the same ref, same pattern as docker.yml's own
# concurrency block: a run superseded by a fresh push tells us nothing nobody
# already gets from the newer commit's own run, and letting it finish anyway
# just bills full CI minutes for a result nobody reads. Found via an August
# cost audit: counta was the one CI workflow in the estate missing this,
# while its sibling repos already had it -- some superseded runs here ran to
# completion uncancelled because there was nothing to cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # arm64-native runners for both jobs: the athena cluster (deploy target)
  # is all arm64, so testing on the deploy architecture means a CI-only
  # architecture bug can't hide. System specs run under cuprite driving
  # apt/snap Chromium, which ships arm64 — no Chrome-for-Testing
  # dependency, so nothing here needs an x86 runner.

  # Static checks are their own job so a style or advisory failure can't be
  # mistaken for a broken test run, and vice versa.
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      # Both jobs share this cache key: install path is pinned to
      # vendor/bundle (not mise's default gem path) so lint and rspec
      # produce identical, cacheable content from the same Gemfile.lock.
      # The benefit is cross-RUN, not cross-job -- actions/cache saves at
      # job end, and lint/rspec run in parallel with no `needs:` between
      # them, so neither can restore what the other wrote in the same run.
      # Once either job has saved a cache, every subsequent run's lint AND
      # rspec restore it. Found via an August cost audit: a cold
      # `bundle install` occasionally stalls on rubygems.org for 45-60
      # minutes (two real runs did, both against this exact step) with
      # nothing here to time it out. Caching means most runs skip the
      # network fetch entirely; timeout-minutes below bounds the ones that
      # can't, instead of letting a stall run to an hour like it did before.
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('Gemfile.lock') }}

      - name: Bundle
        run: |
          mise exec -- bundle config set path vendor/bundle
          mise exec -- bundle install --jobs 4
      - name: Rubocop
        run: mise exec -- bundle exec rubocop
      - name: Brakeman
        run: mise exec -- bundle exec brakeman --no-pager
      - name: Bundler audit
        run: |
          mise exec -- bundle exec bundle-audit update
          mise exec -- bundle exec bundle-audit check

  rspec:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: counta
          POSTGRES_PASSWORD: counta_dev
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U counta"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      # Reads the Ruby pin from mise.toml so CI can't drift from dev machines.
      - uses: jdx/mise-action@v2

      - name: Install Chromium for system specs
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      # See the matching step in the lint job for why this exists.
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('Gemfile.lock') }}

      - name: Bundle
        run: |
          mise exec -- bundle config set path vendor/bundle
          mise exec -- bundle install --jobs 4

      - name: Prepare database
        run: mise exec -- bundle exec rails db:prepare
        env:
          RAILS_ENV: test

      - name: RSpec
        run: mise exec -- bundle exec rspec
